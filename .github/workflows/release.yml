name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... && go vet ./...
      - name: Build standalone binaries and Windows bundle
        shell: bash
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="wj-${os}-${arch}"
            [ "$os" != darwin ] || name="wj-macos-${arch}"
            [ "$os" != windows ] || name="${name}.exe"
            [ "$target" != windows/amd64 ] || name="wj.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$name" .
          done
          cp README.md HUONG-DAN.md Run-Setup.cmd install.ps1 install.cmd install.sh dist/
          cd dist
          zip wj-windows-amd64.zip wj.exe Run-Setup.cmd README.md HUONG-DAN.md
          # v1.5 and older self-update by these file names. Keep publishing them.
          for file in wj.exe wj-*; do cp "$file" "setup-gateway${file#wj}"; done
          # The lite kit as plain files, for people who don't install wj. Made by
          # wj init -lite itself, so it never differs from what wj installs.
          # Built outside the checkout: wj init works from the Git root it finds.
          dist="$PWD"
          for job in general unity web go python; do
            out="$RUNNER_TEMP/kit/$job"
            mkdir -p "$out"
            type_flag=()
            [ "$job" = general ] || type_flag=(-type "$job")
            ./wj-linux-amd64 init -lite "${type_flag[@]}" "$out" < /dev/null > /dev/null
            # Holds an absolute path of this build machine.
            rm -f "$out/.claude/settings.local.json"
            (cd "$out" && zip -qr "$dist/wj-kit-lite-$job.zip" .)
          done
          sha256sum wj* setup-gateway* > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wj-builds
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wj-builds
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/wj*
            dist/setup-gateway*
            dist/checksums.txt
            dist/install.*
